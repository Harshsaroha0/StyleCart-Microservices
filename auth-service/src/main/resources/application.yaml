server:
  port: 8087

spring:
  application:
    name: auth-service

  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:mysql://localhost:3306/stylecart_auth
    username: root
    password: harsh

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.security: DEBUG
jwt:
  secret: 8f4a7c91d2e6b5f8a1c3d9e7b2f6a4c8d1e5f9b3a7c2d6e8
