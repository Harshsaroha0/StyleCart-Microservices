  server:
    port: 8083

  spring:
    application:
      name: cart-service

    config:
      import: optional:configserver:http://localhost:8888

    datasource:
      url: jdbc:mysql://localhost:3306/cart_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      username: root
      password: harsh

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
      open-in-view: false

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
      register-with-eureka: true
      fetch-registry: true

    instance:
      prefer-ip-address: true
